<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nextra CSO Hub — v3.0.1</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%235B3FBE'/%3E%3Ccircle cx='50' cy='50' r='22' fill='white'/%3E%3C/svg%3E">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <style>
    :root {
      --p: #6D40E6;
      --pd: #5030C6;
      --pbg: #F8F6FF;
      --bg: #FAFAF9;
      --dark: #1A1730;
      --dark2: #2D1B4E;
      --mid: #6B6990;
      --ink: #2D2536;
      --line: #E4E0F5;
      --muted: #9B94B3;
      --red: #DC2626;
      --ok: #10B981;
      --warn: #F59E0B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system,'Inter',sans-serif; }
    html, body { width: 100%; height: 100%; background: var(--dark); color: var(--ink); }
    #root { width: 100%; height: 100%; }
    .app-container { display: flex; width: 100vw; height: 100vh; }
    .sidebar { width: 280px; background: var(--dark2); color: #fff; overflow-y: auto; padding: 24px 0; border-right: 1px solid rgba(255,255,255,.1); }
    .sidebar-section { padding: 0 16px; margin-bottom: 24px; }
    .sidebar-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: rgba(255,255,255,.5); margin-bottom: 8px; display: block; }
    .sidebar-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; color: rgba(255,255,255,.7); transition: .12s; position: relative; }
    .sidebar-item:hover { background: rgba(255,255,255,.1); color: #fff; }
    .sidebar-item.active { background: var(--p); color: #fff; font-weight: 600; }
    .sidebar-badge { position: absolute; right: 8px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; min-width: 20px; text-align: center; }
    .main-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
    .header { padding: 20px 28px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; background: #fff; }
    .header-title { font-size: 18px; font-weight: 700; color: var(--dark); }
    .header-sub { font-size: 12px; color: var(--mid); margin-top: 2px; }
    .user-badge { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--pbg); border-radius: 8px; }
    .user-badge span { font-size: 12px; font-weight: 600; color: var(--pd); }
    .content { flex: 1; overflow-y: auto; padding: 20px; }
    .section-grid { display: grid; gap: 20px; }
    .alert-card { background: #fff; border-radius: 12px; padding: 16px; display: flex; gap: 12px; align-items: flex-start; border-left: 4px solid var(--warn); box-shadow: 0 1px 3px rgba(0,0,0,.08); cursor: pointer; transition: .15s; }
    .alert-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.12); }
    .alert-icon { font-size: 20px; flex-shrink: 0; margin-top: 2px; }
    .alert-body { flex: 1; }
    .alert-title { font-size: 13px; font-weight: 700; color: var(--dark); }
    .alert-desc { font-size: 12px; color: var(--mid); margin-top: 2px; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .badge-critical { background: rgba(220,38,38,.1); color: var(--red); }
    .badge-high { background: rgba(245,158,11,.1); color: #D97706; }
    .badge-medium { background: rgba(59,130,246,.1); color: #3B82F6; }
    .badge-low { background: rgba(16,185,129,.1); color: var(--ok); }
    .badge-status { background: var(--pbg); color: var(--pd); }
    .badge-recurrence { background: rgba(220,38,38,.1); color: var(--red); }
    .timeline { display: flex; flex-direction: column; gap: 0; margin-top: 8px; }
    .timeline-item { position: relative; padding: 0 0 18px 22px; border-left: 2px solid var(--line); }
    .timeline-item:last-child { border-left-color: transparent; padding-bottom: 0; }
    .timeline-dot { position: absolute; left: -6px; top: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--p); }
    .timeline-action { font-size: 12px; font-weight: 700; color: var(--dark); }
    .timeline-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .timeline-note { font-size: 12px; color: var(--mid); margin-top: 4px; line-height: 1.5; white-space: pre-wrap; }
    .tabbar { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
    .tabbar-item { padding: 8px 14px; font-size: 12px; font-weight: 600; color: var(--mid); cursor: pointer; border-bottom: 2px solid transparent; }
    .tabbar-item.active { color: var(--pd); border-bottom-color: var(--p); }
    .cost-box { background: var(--bg); border-radius: 9px; padding: 14px; }
    .cost-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px; color: var(--mid); border-bottom: 1px dashed var(--line); }
    .cost-row.total { font-weight: 700; color: var(--dark); border-bottom: none; padding-top: 10px; font-size: 13px; }
    .btn { padding: 10px 16px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: .12s; outline: none; }
    .btn-purple { background: var(--p); color: #fff; }
    .btn-purple:hover { background: var(--pd); }
    .btn-purple:disabled { opacity: .4; cursor: not-allowed; }
    .btn-outline { border: 1px solid var(--line); background: #fff; color: var(--mid); }
    .btn-outline:hover { border-color: var(--p); color: var(--p); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .table-container { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .table { width: 100%; border-collapse: collapse; }
    .table th { background: var(--bg); padding: 12px 16px; text-align: left; font-size: 11px; font-weight: 700; color: var(--mid); text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line); }
    .table td { padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink); }
    .table tr:hover { background: var(--pbg); }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z: 1000; padding: 20px; }
    .modal-content { background: #fff; border-radius: 16px; max-width: 600px; width: 100%; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
    .modal-hdr { padding: 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; }
    .modal-title { font-size: 16px; font-weight: 700; color: var(--dark); }
    .modal-sub { font-size: 12px; color: var(--mid); margin-top: 4px; }
    .close-btn { background: none; border: none; font-size: 24px; color: var(--muted); cursor: pointer; padding: 0; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
    .close-btn:hover { color: var(--dark); }
    .modal-body { padding: 24px; }
    .modal-footer { padding: 20px 24px; border-top: 1px solid var(--line); display: flex; gap: 12px; justify-content: flex-end; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--mid); margin-bottom: 6px; }
    .form-input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; color: var(--ink); background: #fff; outline: none; transition: .12s; font-family: inherit; }
    .form-input:focus { border-color: var(--p); box-shadow: 0 0 0 3px var(--pbg); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    textarea.form-input { resize: vertical; min-height: 80px; line-height: 1.5; }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .checkbox-item { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; font-size: 12px; background: #fff; transition: .12s; }
    .checkbox-item input { display: none; }
    .checkbox-item input:checked + label { display: none; }
    .checkbox-item input:checked ~ label:after { content: ' ✓'; color: var(--p); }
    .checkbox-item input:checked { border-color: var(--p); background: var(--pbg); }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #fff; padding: 14px 18px; border-radius: 8px; font-size: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.15); z: 999; animation: slideIn .3s ease-out; }
    @keyframes slideIn { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .toast.success { border-left: 3px solid var(--ok); color: #065F46; }
    .toast.error { border-left: 3px solid var(--red); color: #7F1D1D; }
    .toast.info { border-left: 3px solid var(--p); color: var(--pd); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    .metric-card { background: linear-gradient(135deg, var(--pbg) 0%, #fff 100%); border-radius: 12px; padding: 18px; border: 1px solid var(--line); }
    .metric-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--mid); letter-spacing: .05em; }
    .metric-value { font-size: 24px; font-weight: 700; color: var(--dark); margin-top: 6px; }
    .metric-sub { font-size: 12px; color: var(--mid); margin-top: 4px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(109,64,230,.25); border-top-color: var(--p); border-radius: 50%; animation: spin .6s linear infinite; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
const { useState, useEffect, useCallback, useContext, createContext, useRef } = React;
const { LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell } = window.Recharts || {};

// ══════════════════════════════════════════════════════════════
// HELPERS & CONTEXT
// ══════════════════════════════════════════════════════════════

const API_BASE = '/api/v1';
const TOKEN = localStorage.getItem('token');

const api = async (path, method='GET', body=null) => {
  const opts = { method, headers: { 'Authorization': `Bearer ${TOKEN}` } };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  else if (method === 'POST' || method === 'PATCH' || method === 'PUT') { opts.headers['Content-Type'] = 'application/json'; opts.body = '{}'; }
  const r = await fetch(API_BASE + path, opts);
  if (r.status === 401) { localStorage.clear(); window.location.href = '/'; }
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    throw new Error(err.message || `HTTP ${r.status}`);
  }
  return r.json();
};

const getUser = () => { const d = localStorage.getItem('user'); return d ? JSON.parse(d) : null; };

// ── v2.0: helpers de arquivo e CSV ─────────────────────────────
const fileToBase64 = (file) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(String(r.result).split(',')[1]);
  r.onerror = () => rej(new Error('Falha ao ler o arquivo.'));
  r.readAsDataURL(file);
});
const fmtBytes = (b) => b > 1048576 ? (b/1048576).toFixed(1)+' MB' : b > 1024 ? Math.round(b/1024)+' KB' : b+' B';
const downloadAttachment = async (id, filename) => {
  const r = await fetch(`${API_BASE}/attachments/file/${id}`, { headers: { 'Authorization': `Bearer ${TOKEN}` } });
  if (!r.ok) throw new Error('Falha ao baixar o anexo.');
  const blob = await r.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
};
// Parser simples de CSV: detecta ; ou , e usa a 1ª linha como cabeçalho
function parseCSV(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (lines.length < 2) return { headers: [], rows: [] };
  const sep = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ';' : ',';
  const headers = lines[0].split(sep).map(h => h.trim().toLowerCase().replace(/"/g, ''));
  const rows = lines.slice(1).map(l => {
    const cells = l.split(sep).map(c => c.trim().replace(/^"|"$/g, ''));
    const o = {}; headers.forEach((h, i) => o[h] = cells[i] || ''); return o;
  });
  return { headers, rows };
}

// ── v2.0: Painel de Anexos (fotos de defeito, NF em PDF, vídeos…) ──
// v3.0: anexos selecionados ANTES de salvar (sobem logo após a criação)
function StagedAttachments({ files, setFiles }) {
  const pick = (e) => {
    const novos = [...(e.target.files || [])].filter(f => f.size <= 10 * 1048576);
    if (novos.length < (e.target.files||[]).length) alert('Arquivos acima de 10MB foram ignorados.');
    setFiles(prev => [...prev, ...novos]); e.target.value = '';
  };
  return <div style={{ marginTop: '10px', paddingTop: '10px', borderTop: '1px dashed var(--border)' }}>
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '6px' }}>
      <span style={{ fontSize: '12px', fontWeight: 700 }}>📎 Anexos ({files.length})</span>
      <label className="btn btn-secondary" style={{ fontSize: '11px', padding: '4px 10px', cursor: 'pointer' }}>
        + Anexar arquivo<input type="file" multiple style={{ display: 'none' }} onChange={pick} />
      </label>
    </div>
    {files.map((f, i) => <div key={i} style={{ display: 'flex', gap: '8px', alignItems: 'center', fontSize: '11.5px', padding: '4px 8px', background: 'var(--bg)', borderRadius: '6px', marginBottom: '3px' }}>
      <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{f.name}</span>
      <span style={{ color: 'var(--muted)' }}>{fmtBytes(f.size)}</span>
      <span style={{ cursor: 'pointer', color: 'var(--danger, #c0392b)' }} onClick={() => setFiles(prev => prev.filter((_, x) => x !== i))}>✕</span>
    </div>)}
  </div>;
}
async function uploadStaged(entityType, entityId, files, toast) {
  for (const f of (files || [])) {
    try {
      const data_base64 = await fileToBase64(f);
      await api(`/attachments/${entityType}/${entityId}`, 'POST', { filename: f.name, mime: f.type, data_base64 });
    } catch (e) { toast?.(`Anexo ${f.name}: ${e.message}`, 'error'); }
  }
}

// v3.0: troca de senha obrigatória no primeiro acesso
function ForcePasswordScreen({ onDone }) {
  const [f, setF] = useState({ atual: '', nova: '', confirma: '' });
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const submit = async () => {
    setErr('');
    if (f.nova !== f.confirma) { setErr('A confirmação não confere com a nova senha.'); return; }
    setBusy(true);
    try {
      await api('/auth/change-password', 'POST', { current_password: f.atual, new_password: f.nova });
      const u = getUser(); u.must_change_password = false;
      localStorage.setItem('user', JSON.stringify(u));
      onDone();
    } catch (e) { setErr(e.message); }
    finally { setBusy(false); }
  };
  return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--dark, #1a1a2e)' }}>
    <div className="card" style={{ maxWidth: '400px', width: '92%', padding: '28px' }}>
      <div style={{ fontSize: '30px', textAlign: 'center' }}>🔐</div>
      <h2 style={{ textAlign: 'center', fontSize: '17px', margin: '8px 0 4px' }}>Defina sua nova senha</h2>
      <p style={{ fontSize: '12px', color: 'var(--muted)', textAlign: 'center', marginBottom: '16px' }}>
        Por segurança, a senha padrão precisa ser trocada antes do primeiro uso. Mínimo de 8 caracteres.</p>
      <div className="form-group"><label className="form-label">Senha atual</label>
        <input className="form-input" type="password" value={f.atual} onChange={e => setF(p => ({ ...p, atual: e.target.value }))} /></div>
      <div className="form-group"><label className="form-label">Nova senha</label>
        <input className="form-input" type="password" value={f.nova} onChange={e => setF(p => ({ ...p, nova: e.target.value }))} /></div>
      <div className="form-group"><label className="form-label">Confirmar nova senha</label>
        <input className="form-input" type="password" value={f.confirma} onChange={e => setF(p => ({ ...p, confirma: e.target.value }))}
          onKeyDown={e => e.key === 'Enter' && submit()} /></div>
      {err && <p style={{ color: 'var(--danger, #c0392b)', fontSize: '12px' }}>{err}</p>}
      <button className="btn btn-primary" style={{ width: '100%', marginTop: '8px' }} disabled={busy} onClick={submit}>
        {busy ? 'Salvando…' : 'Salvar e entrar'}</button>
    </div>
  </div>;
}

// v2.3: exclusão de registro (somente admin, com confirmação dupla)
function DeleteButton({ path, id, label, onDeleted, toast }) {
  const me = getUser();
  const [busy, setBusy] = useState(false);
  if (me?.role !== 'admin') return null;
  const del = async () => {
    if (!window.confirm(`Excluir ${label} ${id}?\n\nAnexos e histórico serão removidos junto. Esta ação fica registrada na auditoria e NÃO pode ser desfeita.`)) return;
    setBusy(true);
    try { await api(`/${path}/${id}`, 'DELETE'); toast?.(`${label} ${id} excluído.`); onDeleted?.(); }
    catch(e) { toast?.(e.message, 'error'); }
    finally { setBusy(false); }
  };
  return <button className="btn btn-secondary" disabled={busy} onClick={del}
    style={{ color: 'var(--danger, #c0392b)', fontSize: '11.5px', padding: '5px 12px' }}>
    {busy ? 'Excluindo…' : '🗑 Excluir'}
  </button>;
}

// v2.1: separa listas de AM e BDM pelo campo title do usuário; se ninguém
// tiver o título (base antiga), cai de volta para a lista completa.
const byTitle = (list, t) => {
  const f = (list || []).filter(u => (u.title || '').toUpperCase() === t);
  return f.length ? f : (list || []);
};

function AttachmentsPanel({ entityType, entityId, toast }) {
  const [items, setItems] = useState([]);
  const [busy, setBusy] = useState(false);
  const me = getUser();
  const load = async () => { try { setItems(await api(`/attachments/${entityType}/${entityId}`)); } catch {} };
  useEffect(() => { if (entityId) load(); }, [entityType, entityId]);
  const onPick = async (e) => {
    const file = e.target.files?.[0]; e.target.value = '';
    if (!file) return;
    if (file.size > 10 * 1048576) { toast?.('Arquivo excede 10MB.', 'error'); return; }
    setBusy(true);
    try {
      const data_base64 = await fileToBase64(file);
      await api(`/attachments/${entityType}/${entityId}`, 'POST', { filename: file.name, mime: file.type, data_base64 });
      toast?.('Anexo enviado.');
      await load();
    } catch (err) { toast?.(err.message, 'error'); }
    finally { setBusy(false); }
  };
  const del = async (id) => {
    if (!window.confirm('Excluir este anexo?')) return;
    try { await api(`/attachments/${id}`, 'DELETE'); await load(); } catch (err) { toast?.(err.message, 'error'); }
  };
  return <div style={{ marginTop: '14px', paddingTop: '12px', borderTop: '1px dashed var(--border)' }}>
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '8px' }}>
      <span style={{ fontSize: '12.5px', fontWeight: 700 }}>📎 Anexos ({items.length})</span>
      <label className="btn btn-secondary" style={{ fontSize: '11.5px', padding: '5px 12px', cursor: busy ? 'wait' : 'pointer' }}>
        {busy ? 'Enviando…' : '+ Anexar arquivo'}
        <input type="file" style={{ display: 'none' }} onChange={onPick} disabled={busy} />
      </label>
    </div>
    {!items.length ? <p style={{ fontSize: '11.5px', color: 'var(--muted)' }}>Nenhum anexo. Fotos do defeito, NF em PDF e vídeos fortalecem a tratativa com o fornecedor.</p> :
      <div style={{ display: 'flex', flexDirection: 'column', gap: '5px' }}>
        {items.map(a => <div key={a.id} style={{ display: 'flex', alignItems: 'center', gap: '8px', padding: '7px 10px', background: 'var(--bg)', borderRadius: '7px', fontSize: '12px' }}>
          <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{a.filename}</span>
          <span style={{ color: 'var(--muted)', fontSize: '11px' }}>{fmtBytes(a.size_bytes)}</span>
          <span style={{ color: 'var(--muted)', fontSize: '11px' }}>{a.uploaded_by_name || ''}</span>
          {a.drive_url && <a href={a.drive_url} target="_blank" rel="noreferrer" className="btn btn-secondary" style={{ padding: '3px 9px', fontSize: '11px', textDecoration: 'none' }} title="Abrir no Google Drive">📁</a>}
          <button className="btn btn-secondary" style={{ padding: '3px 9px', fontSize: '11px' }} onClick={() => downloadAttachment(a.id, a.filename).catch(e => toast?.(e.message, 'error'))}>⬇</button>
          {(me?.role === 'admin') && <button className="btn btn-secondary" style={{ padding: '3px 9px', fontSize: '11px', color: 'var(--danger, #c0392b)' }} onClick={() => del(a.id)}>✕</button>}
        </div>)}
      </div>}
  </div>;
}

// ── v2.0: Busca Global (CNPJ, NF, serial, produto, cliente…) ───
function GlobalSearch({ onNavigate }) {
  const [q, setQ] = useState('');
  const [res, setRes] = useState(null);
  const [open, setOpen] = useState(false);
  const tRef = useRef(null);
  const run = (val) => {
    clearTimeout(tRef.current);
    if (val.trim().length < 2) { setRes(null); setOpen(false); return; }
    tRef.current = setTimeout(async () => {
      try { setRes(await api(`/search?q=${encodeURIComponent(val.trim())}`)); setOpen(true); } catch {}
    }, 350);
  };
  const go = (view) => { setOpen(false); setQ(''); setRes(null); onNavigate(view); };
  const group = (title, arr, view, render) => !arr?.length ? null :
    <div key={title}>
      <div style={{ fontSize: '10px', fontWeight: 700, color: 'var(--muted)', textTransform: 'uppercase', padding: '6px 12px 2px' }}>{title}</div>
      {arr.map((it, i) => <div key={i} onClick={() => go(view)} style={{ padding: '7px 12px', fontSize: '12px', cursor: 'pointer', borderRadius: '6px' }}
        onMouseEnter={e => e.currentTarget.style.background = 'var(--bg)'} onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>{render(it)}</div>)}
    </div>;
  const total = res ? ['clients','tickets','returns','rma','complaints'].reduce((s, k) => s + (res[k]?.length || 0), 0) : 0;
  return <div style={{ position: 'relative', flex: 1, maxWidth: '420px', margin: '0 20px' }}>
    <input className="form-input" placeholder="🔍 Buscar cliente, CNPJ, NF, serial, produto…" value={q}

      style={{ fontSize: '12.5px', padding: '8px 12px' }} />
    {open && res && <div style={{ position: 'absolute', top: '42px', left: 0, right: 0, background: '#fff', border: '1px solid var(--border)', borderRadius: '10px', boxShadow: '0 10px 30px rgba(0,0,0,.12)', zIndex: 90, maxHeight: '380px', overflowY: 'auto', padding: '4px' }}>

        {group('Clientes', res.clients, 'clients360', c => <><b>{c.name}</b> <span style={{ color: 'var(--muted)' }}>{c.cnpj || ''}</span></>)}
        {group('Chamados', res.tickets, 'tickets', t => <><b>{t.id}</b> — {t.client_name} <span style={{ color: 'var(--muted)' }}>({t.status})</span></>)}

        {group('RMA', res.rma, 'rma', r => <><b>#{r.id}</b> — {r.product_name} <span style={{ color: 'var(--muted)' }}>{r.serial_number || ''}</span></>)}
        {group('Reclamações', res.complaints, 'complaints', c => <><b>#{c.id}</b> — {c.client_name || 'cliente n/i'} <span style={{ color: 'var(--muted)' }}>({c.severity})</span></>)}
      </>}
    </div>}
  </div>;
}

const formatCPF = (v) => v.replace(/\D/g, '').replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/g, '$1.$2.$3/$4-$5');
const formatCNPJ = formatCPF; // alias — a máscara já é a de CNPJ (14 dígitos)

function isValidCNPJ(raw) {
  const c = (raw || '').replace(/\D/g, '');
  if (c.length !== 14 || /^(\d)\1{13}$/.test(c)) return false;
  const calc = (len) => {
    const weights = len === 12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2];
    let sum = 0;
    for (let i = 0; i < len; i++) sum += parseInt(c[i]) * weights[i];
    const r = sum % 11;
    return r < 2 ? 0 : 11 - r;
  };
  return calc(12) === parseInt(c[12]) && calc(13) === parseInt(c[13]);
}
const formatMoney = (v) => `R$ ${(parseFloat(v)||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2})}`;
const formatPhone = (v) => v.replace(/\D/g, '').replace(/(\d{2})(\d{4,5})(\d{4})/g, '($1) $2-$3');
const formatDate = (v) => v ? new Date(v).toLocaleString('pt-BR') : '—';

const SEVERITY_CLASS = { critical: 'badge-critical', high: 'badge-high', medium: 'badge-medium', low: 'badge-low' };
function Pill({ children, tone }) {
  const cls = SEVERITY_CLASS[tone] || 'badge-status';
  return <span className={`badge ${cls}`}>{children}</span>;
}

function Timeline({ items }) {
  if (!items || !items.length) return <p style={{ fontSize: '12px', color: 'var(--muted)' }}>Sem histórico ainda.</p>;
  return <div className="timeline">

        <div className="timeline-action">{h.action}</div>
        <div className="timeline-meta">{h.user_name || 'Sistema'} • {formatDate(h.created_at)}</div>
        {h.note && <div className="timeline-note">{h.note}</div>}

}

function Toasts({ toasts }) {
  return <>{toasts.map(t => <div key={t.id} className={`toast ${t.type}`}>{t.msg}</div>)}</>;
}

function useToasts() {
  const [toasts, setToasts] = useState([]);
  const push = (msg, type = 'success') => {
    const id = Date.now() + Math.random();
    setToasts(p => [...p, { id, msg, type }]);
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3500);
  };
  return { toasts, push };
}

  useEffect(() => {
    loadTickets();
  }, [filters.status, filters.criticality, filters.area_responsible]);

  const buildQuery = () => {
    const p = new URLSearchParams();
    if (filters.status) p.set('status', filters.status);
    if (filters.criticality) p.set('criticality', filters.criticality);
    if (filters.area_responsible) p.set('area_responsible', filters.area_responsible);
    if (filters.q) p.set('q', filters.q);
    return p.toString();

  const loadTickets = async () => {
    setLoading(true);
    try {
      const qs = buildQuery();
      const { data } = await api(`/tickets${qs ? '?' + qs : ''}`);
      setTickets(data || []);
    } catch(e) { console.error(e); }

function KanbanView({ toast }) {
  const [tickets, setTickets] = useState([]);
  const [loading, setLoading] = useState(true);
  const [users, setUsers] = useState([]);
  const [clients, setClients] = useState([]);
  const [filters, setFilters] = useState({ area_responsible: '', criticality: '', am_user_id: '', bdm_user_id: '', client_id: '' });
  const [dragOverCol, setDragOverCol] = useState(null);
  const [selectedId, setSelectedId] = useState(null);

  const load = async () => {
    setLoading(true);
    try {
      const p = new URLSearchParams();
      Object.entries(filters).forEach(([k,v]) => { if (v) p.set(k, v); });
      p.set('limit', '300');
      const { data } = await api(`/tickets?${p.toString()}`);
      setTickets(data || []);
    } catch(e) { toast?.(e.message, 'error'); }
    finally { setLoading(false); }
  };
  useEffect(() => { load(); }, [filters.area_responsible, filters.criticality, filters.am_user_id, filters.bdm_user_id, filters.client_id]);
  useEffect(() => { (async () => {
    try { setUsers(await api('/users/lookup')); } catch(e) {}
    try { const { data } = await api('/clients'); setClients(data || []); } catch(e) {}
  })(); }, []);

  const moveTicket = async (ticketId, fromStatus, toStatus) => {
    if (fromStatus === toStatus) return;
    const allowed = TICKET_STATUS_NEXT[fromStatus] || [];
    if (!allowed.includes(toStatus)) {
      toast?.(`Transição bloqueada: "${TICKET_STATUS_LABEL[fromStatus]}" não pode ir direto para "${TICKET_STATUS_LABEL[toStatus]}".`, 'error');
      return;
    }
    // Atualização otimista — reverte se o backend recusar (ex: falta causa raiz para encerrar).
    setTickets(prev => prev.map(t => t.id === ticketId ? { ...t, status: toStatus } : t));
    try {
      await api(`/tickets/${ticketId}/status`, 'PATCH', { status: toStatus });
      toast?.(`${ticketId} movido para "${TICKET_STATUS_LABEL[toStatus]}".`);
    } catch(e) {
      setTickets(prev => prev.map(t => t.id === ticketId ? { ...t, status: fromStatus } : t));
      toast?.(e.message, 'error');
    }
  };

  const onDrop = (e, toStatus) => {
    e.preventDefault();
    setDragOverCol(null);
    const ticketId = e.dataTransfer.getData('text/ticket-id');
    const fromStatus = e.dataTransfer.getData('text/from-status');
    if (ticketId) moveTicket(ticketId, fromStatus, toStatus);
  };

  const grouped = {};
  KANBAN_COLUMNS.forEach(s => { grouped[s] = []; });
  tickets.forEach(t => { if (grouped[t.status]) grouped[t.status].push(t); });

  return <div className="section-grid">
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
      <div><div className="header-title">🗂️ Kanban dos Chamados</div><div className="header-sub">Arraste os cards entre colunas — transições inválidas são bloqueadas automaticamente</div></div>
    </div>

    <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
      <select className="form-input" style={{ maxWidth: '170px' }} value={filters.area_responsible} onChange={e => setFilters(p => ({ ...p, area_responsible: e.target.value }))}>
        <option value="">Toda área</option>
        <option value="support">Suporte Técnico</option><option value="operations">Operações/CD</option><option value="sales">Comercial</option>
        <option value="purchasing">Compras</option><option value="warehouse">CD/Estoque</option><option value="fiscal">Fiscal</option>
        <option value="rma">RMA</option><option value="financial">Financeiro</option>
      </select>
      <select className="form-input" style={{ maxWidth: '150px' }} value={filters.criticality} onChange={e => setFilters(p => ({ ...p, criticality: e.target.value }))}>
        <option value="">Toda criticidade</option>
        <option value="critical">Crítica</option><option value="high">Alta</option><option value="medium">Média</option><option value="low">Baixa</option>
      </select>
      <select className="form-input" style={{ maxWidth: '180px' }} value={filters.am_user_id} onChange={e => setFilters(p => ({ ...p, am_user_id: e.target.value }))}>
        <option value="">Todo AM</option>
        {byTitle(users,'AM').map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
      </select>
      <select className="form-input" style={{ maxWidth: '180px' }} value={filters.bdm_user_id} onChange={e => setFilters(p => ({ ...p, bdm_user_id: e.target.value }))}>
        <option value="">Todo BDM</option>
        {byTitle(users,'BDM').map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
      </select>
      <select className="form-input" style={{ maxWidth: '200px' }} value={filters.client_id} onChange={e => setFilters(p => ({ ...p, client_id: e.target.value }))}>
        <option value="">Todo cliente</option>
        {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
      </select>
    </div>

    {loading ? <div style={{ textAlign: 'center', padding: '40px' }}><span className="spinner" /></div> :
    <div style={{ display: 'flex', gap: '12px', overflowX: 'auto', paddingBottom: '12px' }}>
      {KANBAN_COLUMNS.map(status => (
        <div key={status}
          onDragOver={e => { e.preventDefault(); setDragOverCol(status); }}
          onDragLeave={() => setDragOverCol(prev => prev === status ? null : prev)}
          onDrop={e => onDrop(e, status)}
          style={{ minWidth: '260px', maxWidth: '260px', background: dragOverCol === status ? 'var(--pbg)' : 'var(--bg)', borderRadius: '10px', padding: '10px', border: dragOverCol === status ? '2px dashed var(--p)' : '2px dashed transparent' }}>
          <div style={{ fontSize: '12px', fontWeight: 700, color: 'var(--pd)', marginBottom: '8px', display: 'flex', justifyContent: 'space-between' }}>
            <span>{TICKET_STATUS_LABEL[status]}</span><span className="badge badge-status">{grouped[status].length}</span>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', minHeight: '60px' }}>
            {grouped[status].map(t => (
              <div key={t.id} draggable
                onDragStart={e => { e.dataTransfer.setData('text/ticket-id', t.id); e.dataTransfer.setData('text/from-status', t.status); }}
                onClick={() => setSelectedId(t.id)}
                style={{ background: '#fff', borderRadius: '8px', padding: '10px', boxShadow: '0 1px 3px rgba(0,0,0,.08)', cursor: 'grab', borderLeft: `3px solid ${t.criticality==='critical'?'var(--red)':t.criticality==='high'?'#F59E0B':'var(--line)'}` }}>
                <div style={{ fontSize: '11px', fontFamily: 'monospace', fontWeight: 700, color: 'var(--pd)' }}>{t.id}</div>
                <div style={{ fontSize: '12.5px', fontWeight: 600, color: 'var(--ink)', marginTop: '2px' }}>{t.client_name}</div>
                <div style={{ fontSize: '11px', color: 'var(--muted)', marginTop: '2px' }}>{t.product_name_snap || '—'} {t.quantity ? `(x${t.quantity})` : ''}</div>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '6px' }}>
                  <span className={`badge badge-${t.criticality}`} style={{ fontSize: '10px' }}>{t.criticality}</span>
                  <span style={{ fontSize: '10px', color: t.sla_state === 'overdue' ? 'var(--red)' : 'var(--muted)' }}>{t.sla_state === 'overdue' ? '⚠ SLA vencido' : (t.am_name || 'sem AM')}</span>
                </div>
              </div>
            ))}
            {!grouped[status].length && <div style={{ fontSize: '11px', color: 'var(--muted)', textAlign: 'center', padding: '10px 0' }}>—</div>}
          </div>
        </div>
      ))}
    </div>}

    {selectedId && <TicketDetailModal id={selectedId} onClose={() => setSelectedId(null)} onChanged={load} toast={toast} />}
  </div>;
}

function CreateTicketModal({ onClose, onCreated, toast }) {
  const [staged, setStaged] = useState([]);
  const [f, setF] = useState({
    business_unit_id: 'led', client_id: '', client_name: '', cnpj: '', channel: 'whatsapp',
    occurrence_type: 'technical_support', criticality: 'medium',
    area_responsible: 'support', notify_areas: [],
    product: '', product_group: '', brand: '', quantity: '1', serial_number: '', order_number: '', nf_number: '',
    order_value: '', revenue_at_risk: '', description: '', expectation: '', previous_action: '',
    am_user_id: '', bdm_user_id: '', is_vip: false, is_recurrence: false
  });
  const [users, setUsers] = useState([]);
  const [clients, setClients] = useState([]);
  const [showQuickClient, setShowQuickClient] = useState(false);
  const [quickClient, setQuickClient] = useState({ name: '', cnpj: '' });
  const [busy, setBusy] = useState(false);
  const [aiLoading, setAiLoading] = useState(false);
  const [aiResult, setAiResult] = useState(null);
  const [aiConfigured, setAiConfigured] = useState(null);

  useEffect(() => { (async () => { try { const s = await api('/ai/status'); setAiConfigured(!!s.configured); } catch(e) { setAiConfigured(false); } })(); }, []);

  const loadClients = async () => { try { const { data } = await api('/clients'); setClients(data || []); } catch(e) {} };
  useEffect(() => {
    (async () => {
      try { const u = await api('/users/lookup?role=sales'); setUsers(u); } catch(e) { console.error(e); }
      await loadClients();
    })();
  }, []);

  const selectClient = (clientId) => {
    const c = clients.find(cl => String(cl.id) === String(clientId));
    setF(p => ({ ...p, client_id: clientId, client_name: c ? c.name : p.client_name, cnpj: c && c.cnpj ? formatCNPJ(c.cnpj) : p.cnpj }));
  };

  const quickCreateClient = async () => {
    if (!quickClient.name.trim()) { toast?.('Nome do cliente é obrigatório.', 'error'); return; }
    if (quickClient.cnpj && !isValidCNPJ(quickClient.cnpj)) { toast?.('CNPJ inválido — confira os números.', 'error'); return; }
    try {
      const created = await api('/clients', 'POST', { name: quickClient.name.trim(), cnpj: quickClient.cnpj || null });
      await loadClients();
      selectClient(created.id);
      setShowQuickClient(false); setQuickClient({ name: '', cnpj: '' });
      toast?.('Cliente cadastrado e selecionado.');
    } catch(e) { toast?.(e.message, 'error'); }
  };

  const areas = [
    { v: 'support', l: 'Suporte Técnico' },
    { v: 'operations', l: 'Operações/CD' },
    { v: 'sales', l: 'Comercial' },
    { v: 'purchasing', l: 'Compras' },
    { v: 'warehouse', l: 'CD/Estoque' },
    { v: 'fiscal', l: 'Fiscal' },
    { v: 'rma', l: 'RMA' },
    { v: 'financial', l: 'Financeiro' },
  ];

  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const toggleArea = a => setF(p => ({ ...p, notify_areas: p.notify_areas.includes(a) ? p.notify_areas.filter(x => x !== a) : [...p.notify_areas, a] }));

  const runAI = async () => {
    if (!f.description || f.description.length < 10) return;
    setAiLoading(true);
    try {
      const { result } = await api('/ai/triage', 'POST', {
        client_name: f.client_name, business_unit_id: f.business_unit_id,
        product: f.product, description: f.description,
        expectation: f.expectation, previous_action: f.previous_action
      });
      setAiResult(result);
    } catch(e) { toast?.(e.message || 'Não foi possível obter a sugestão de IA.', 'error'); }
    finally { setAiLoading(false); }
  };

  const submit = async (e) => {
    e.preventDefault();
    if (!f.client_name.trim() || !f.description.trim() || f.description.length < 10) return;
    if (!f.nf_number.trim()) { toast?.('Nota Fiscal (NF) é obrigatória.', 'error'); return; }
    const qty = Number(f.quantity);
    if (!Number.isInteger(qty) || qty <= 0) { toast?.('Quantidade deve ser um número inteiro maior que zero.', 'error'); return; }
    setBusy(true);
    try {
      const p = { ...f, client_id: f.client_id ? parseInt(f.client_id) : null, quantity: qty,
        order_value: f.order_value ? parseFloat(f.order_value) : null, revenue_at_risk: f.revenue_at_risk ? parseFloat(f.revenue_at_risk) : 0 };
      const criado = await api('/tickets', 'POST', p);
      await uploadStaged('ticket', criado.id, staged, toast);
      onCreated();
    } catch(e) { toast?.(e.message, 'error'); }
    finally { setBusy(false); }
  };

  const inp = { width: '100%', padding: '10px 12px', border: '1px solid var(--line)', borderRadius: '8px', fontSize: '13px', color: 'var(--ink)', background: '#fff', outline: 'none', fontFamily: 'inherit' };

  return <div className="modal" onClick={e => e.target === e.currentTarget && onClose()}>
    <div className="modal-content">
      <div className="modal-hdr">
        <div><div className="modal-title">📋 Abrir Chamado</div><div className="modal-sub">Registrar nova ocorrência de pós-venda</div></div>
        <button className="close-btn" onClick={onClose}>×</button>
      </div>
      <form onSubmit={submit} style={{ padding: '24px' }}>
        {/* SEÇÃO 1 — IDENTIFICAÇÃO */}
        <div style={{ background: 'var(--bg)', borderRadius: '9px', padding: '14px', marginBottom: '12px' }}>
          <div style={{ fontSize: '11px', fontWeight: '700', color: 'var(--pd)', textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: '10px' }}>Identificação</div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '12px' }}>
            <div><label className="form-label">BU *</label><select style={inp} value={f.business_unit_id} onChange={e=>set('business_unit_id',e.target.value)}><option value="led">LED / PRO AV</option><option value="av">Áudio e Vídeo</option><option value="seg">Segurança Eletrônica</option><option value="cab">Cabeamento</option></select></div>
            <div><label className="form-label">Canal *</label><select style={inp} value={f.channel} onChange={e=>set('channel',e.target.value)}><option value="whatsapp">WhatsApp</option><option value="email">E-mail</option><option value="phone">Telefone</option><option value="sales">Comercial</option><option value="portal">Portal</option></select></div>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: '12px' }}>
            <div>
              <label className="form-label">Cliente *</label>
              <select style={inp} value={f.client_id} onChange={e => selectClient(e.target.value)}>
                <option value="">Selecione um cliente cadastrado...</option>
                {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
              {!showQuickClient
                ? <div style={{ marginTop: '4px' }}><a href="#" onClick={e => { e.preventDefault(); setShowQuickClient(true); }} style={{ fontSize: '11px', color: 'var(--p)' }}>+ Cliente novo? Cadastro rápido</a></div>
                : <div style={{ marginTop: '8px', padding: '10px', background: '#fff', border: '1px dashed var(--line)', borderRadius: '8px', display: 'flex', gap: '8px', alignItems: 'flex-end' }}>
                    <div style={{ flex: 1 }}><label className="form-label">Nome do cliente</label><input style={inp} value={quickClient.name} onChange={e => setQuickClient(p => ({ ...p, name: e.target.value }))} /></div>
                    <div style={{ flex: 1 }}><label className="form-label">CNPJ (opcional)</label><input style={inp} value={quickClient.cnpj} onChange={e => setQuickClient(p => ({ ...p, cnpj: formatCNPJ(e.target.value) }))} maxLength={18} /></div>
                    <button type="button" className="btn btn-sm btn-purple" onClick={quickCreateClient}>Cadastrar</button>
                    <button type="button" className="btn btn-sm btn-outline" onClick={() => setShowQuickClient(false)}>Cancelar</button>
                  </div>}
              {!f.client_id && f.client_name && <p style={{ fontSize: '11px', color: 'var(--muted)', marginTop: '4px' }}>Nenhum cliente selecionado da lista central — o chamado será salvo só com o nome digitado.</p>}
            </div>
            <div><label className="form-label">CNPJ</label>
              <input style={{...inp, borderColor: f.cnpj.replace(/\D/g,'').length===14 ? (isValidCNPJ(f.cnpj)?'var(--ok)':'var(--red)') : inp.borderColor}} value={f.cnpj} onChange={e=>set('cnpj',formatCNPJ(e.target.value))} placeholder="00.000.000/0000-00" maxLength={18}/>
              {f.cnpj.replace(/\D/g,'').length===14 && (
                <span style={{ fontSize: '11px', fontWeight: 600, color: isValidCNPJ(f.cnpj) ? 'var(--ok)' : 'var(--red)' }}>
                  {isValidCNPJ(f.cnpj) ? '✓ CNPJ válido' : '✗ CNPJ inválido — confira os números'}
                </span>
              )}
            </div>
          </div>
          <div style={{ marginTop: '10px', display: 'flex', gap: '20px' }}>
            <label style={{ display: 'flex', alignItems: 'center', gap: '7px', fontSize: '13px', color: 'var(--mid)', cursor: 'pointer' }}><input type="checkbox" checked={f.is_vip} onChange={e=>set('is_vip',e.target.checked)}/> ⭐ Cliente VIP</label>
            <label style={{ display: 'flex', alignItems: 'center', gap: '7px', fontSize: '13px', color: 'var(--mid)', cursor: 'pointer' }}><input type="checkbox" checked={f.is_recurrence} onChange={e=>set('is_recurrence',e.target.checked)}/> ↩ Recorrência</label>
          </div>
        </div>

        {/* SEÇÃO 2 — PRODUCT & EQUIPE */}
        <div style={{ background: 'var(--bg)', borderRadius: '9px', padding: '14px', marginBottom: '12px' }}>
          <div style={{ fontSize: '11px', fontWeight: '700', color: 'var(--pd)', textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: '10px' }}>Produto e Equipe</div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '12px', marginBottom: '12px' }}>
            <div><label className="form-label">Produto</label><input style={inp} value={f.product} onChange={e=>set('product',e.target.value)} placeholder="Módulo P3, Painel..."/></div>
            <div><label className="form-label">Grupo do Produto</label><input style={inp} value={f.product_group} onChange={e=>set('product_group',e.target.value)} placeholder="Ex: Painéis LED"/></div>
            <div><label className="form-label">Marca</label><input style={inp} value={f.brand} onChange={e=>set('brand',e.target.value)} placeholder="Ex: Nextra, Absen..."/></div>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '12px', marginBottom: '12px' }}>
            <div><label className="form-label">Quantidade *</label><input style={inp} type="number" min="1" step="1" value={f.quantity} onChange={e=>set('quantity',e.target.value)} /></div>
            <div><label className="form-label">Nº de Série</label><input style={inp} value={f.serial_number} onChange={e=>set('serial_number',e.target.value)} placeholder="SN-XXXXXX"/></div>
            <div><label className="form-label">AM (Account Manager)</label><select style={inp} value={f.am_user_id} onChange={e=>set('am_user_id',e.target.value)}><option value="">— Nenhum —</option>{byTitle(users,'AM').map(u=><option key={u.id} value={u.id}>{u.name}</option>)}</select></div>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
            <div><label className="form-label">BDM (Desenvolvimento de Negócios)</label><select style={inp} value={f.bdm_user_id} onChange={e=>set('bdm_user_id',e.target.value)}><option value="">— Nenhum —</option>{byTitle(users,'BDM').map(u=><option key={u.id} value={u.id}>{u.name}</option>)}</select></div>
          </div>
        </div>

        {/* SEÇÃO 3 — PEDIDO & VALORES */}
        <div style={{ background: 'var(--bg)', borderRadius: '9px', padding: '14px', marginBottom: '12px' }}>
          <div style={{ fontSize: '11px', fontWeight: '700', color: 'var(--pd)', textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: '10px' }}>Pedido e Valores</div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '12px', marginBottom: '12px' }}>
            <div><label className="form-label">Nº Pedido</label><input style={inp} value={f.order_number} onChange={e=>set('order_number',e.target.value)} placeholder="PED-00000"/></div>
            <div><label className="form-label">Nº NF *</label>
              <input style={{...inp, borderColor: !f.nf_number.trim() ? 'var(--red)' : inp.borderColor}} value={f.nf_number} onChange={e=>set('nf_number',e.target.value)} placeholder="NF-00000"/>
              {!f.nf_number.trim() && <span style={{ fontSize: '11px', color: 'var(--red)' }}>Nota Fiscal é obrigatória.</span>}
            </div>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
            <div><label className="form-label">Valor do Pedido (R$)</label><input style={inp} type="number" step="0.01" value={f.order_value} onChange={e=>set('order_value',e.target.value)} placeholder="0.00"/></div>
            <div><label className="form-label">Receita em Risco (R$)</label><input style={inp} type="number" step="0.01" value={f.revenue_at_risk} onChange={e=>set('revenue_at_risk',e.target.value)} placeholder="0.00"/></div>
          </div>
        </div>

        {/* SEÇÃO 4 — DESCRIÇÃO + IA */}
        <div style={{ background: 'var(--bg)', borderRadius: '9px', padding: '14px', marginBottom: '12px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
            <span style={{ fontSize: '11px', fontWeight: '700', color: 'var(--pd)', textTransform: 'uppercase', letterSpacing: '.06em' }}>Descrição da Ocorrência</span>
            <button type="button" onClick={runAI} disabled={aiLoading || !f.description || f.description.length < 10 || aiConfigured === false} style={{ padding: '6px 14px', background: 'var(--dark2)', border: 'none', borderRadius: '8px', color: '#fff', fontSize: '12px', fontWeight: '700', cursor: 'pointer', opacity: (!f.description || f.description.length < 10 || aiConfigured === false) ? 0.35 : 1 }}>
              {aiLoading ? <><span className="spinner" style={{ marginRight: '6px' }} />Analisando...</> : <>✦ Triagem por IA</>}
            </button>
            {aiConfigured === false && <span style={{ fontSize: '11px', color: 'var(--muted)', marginLeft: '8px' }}>⚠ IA não configurada neste ambiente</span>}
          </div>
          <div><label className="form-label">Descrição completa *</label><textarea style={{...inp,minHeight:'76px',resize:'vertical',lineHeight:'1.5'}} value={f.description} onChange={e=>set('description',e.target.value)} placeholder="O que aconteceu, quando, como o cliente reportou..."/></div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginTop: '10px' }}>
            <div><label className="form-label">Expectativa do Cliente</label><textarea style={{...inp,minHeight:'52px',resize:'vertical',lineHeight:'1.5'}} value={f.expectation} onChange={e=>set('expectation',e.target.value)} placeholder="O que o cliente espera como resolução?"/></div>
            <div><label className="form-label">Ação Já Tentada</label><textarea style={{...inp,minHeight:'52px',resize:'vertical',lineHeight:'1.5'}} value={f.previous_action} onChange={e=>set('previous_action',e.target.value)} placeholder="O que já foi feito para resolver?"/></div>
          </div>
          {aiResult && (
            <div style={{ marginTop: '12px', padding: '14px', background: 'rgba(109,64,230,.07)', border: '1px solid var(--pb)', borderRadius: '9px' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                <span style={{ fontSize: '11px', fontWeight: '700', color: 'var(--pd)', textTransform: 'uppercase', letterSpacing: '.06em' }}>✦ Análise da IA</span>
                <button type="button" onClick={() => { setF(p=>({...p,occurrence_type:aiResult.occurrence_type||p.occurrence_type,criticality:aiResult.criticality||p.criticality,notify_areas:Array.isArray(aiResult.notify_areas)?aiResult.notify_areas:p.notify_areas})); setAiResult(null); }} style={{ padding: '5px 12px', background: 'var(--p)', border: 'none', borderRadius: '6px', color: '#fff', fontSize: '11px', fontWeight: '700', cursor: 'pointer' }}>Aplicar ao Formulário →</button>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', marginBottom: '10px' }}>
                <div><span style={{ fontSize: '10px', fontWeight: '700', color: 'var(--muted)', textTransform: 'uppercase' }}>Tipo sugerido</span><p style={{ fontSize: '12px', color: 'var(--dark)', marginTop: '2px', lineHeight: '1.5' }}>{aiResult.occurrence_type}</p></div>
                <div><span style={{ fontSize: '10px', fontWeight: '700', color: 'var(--muted)', textTransform: 'uppercase' }}>Criticidade</span><p style={{ fontSize: '12px', color: 'var(--dark)', marginTop: '2px', lineHeight: '1.5' }}>{aiResult.criticality}</p></div>
                <div><span style={{ fontSize: '10px', fontWeight: '700', color: 'var(--muted)', textTransform: 'uppercase' }}>Causa Raiz Hipótese</span><p style={{ fontSize: '12px', color: 'var(--dark)', marginTop: '2px', lineHeight: '1.5' }}>{aiResult.root_cause_hypothesis}</p></div>
                <div><span style={{ fontSize: '10px', fontWeight: '700', color: 'var(--muted)', textTransform: 'uppercase' }}>Próximos Passos</span><p style={{ fontSize: '12px', color: 'var(--dark)', marginTop: '2px', lineHeight: '1.5' }}>{aiResult.next_steps}</p></div>
              </div>
              {aiResult.client_communication && (
                <div style={{ background: '#fff', borderRadius: '7px', padding: '10px', borderLeft: '3px solid var(--p)' }}>
                  <span style={{ fontSize: '10px', fontWeight: '700', color: 'var(--muted)', textTransform: 'uppercase', display: 'block', marginBottom: '4px' }}>💬 Rascunho — Primeira resposta ao cliente</span>
                  <p style={{ fontSize: '12px', color: 'var(--mid)', lineHeight: '1.6', whiteSpace: 'pre-wrap', fontStyle: 'italic' }}>{aiResult.client_communication}</p>
                </div>
              )}
            </div>
          )}
        </div>

        {/* SEÇÃO 5 — CLASSIFICAÇÃO */}
        <div style={{ background: 'var(--bg)', borderRadius: '9px', padding: '14px', marginBottom: '12px' }}>
          <div style={{ fontSize: '11px', fontWeight: '700', color: 'var(--pd)', textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: '10px' }}>Classificação</div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
            <div><label className="form-label">Tipo de Ocorrência *</label><select style={inp} value={f.occurrence_type} onChange={e=>set('occurrence_type',e.target.value)}><option value="technical_support">Suporte Técnico</option><option value="complaint">Reclamação de Cliente</option><option value="rma">RMA / Defeito de Produto</option><option value="operational_problem">Problema Operacional</option><option value="delivery_problem">Atraso de Entrega</option><option value="incomplete_order">Pedido Incompleto / Incorreto</option><option value="warranty">Solicitação de Garantia</option><option value="exchange_return">Troca / Devolução</option><option value="billing_issue">Problema Fiscal</option><option value="other">Outro</option></select></div>
            <div><label className="form-label">Criticidade *</label><select style={inp} value={f.criticality} onChange={e=>set('criticality',e.target.value)}><option value="critical">🔴 Crítica — SLA 8h</option><option value="high">🟠 Alta — SLA 24h</option><option value="medium">🟡 Média — SLA 48h</option><option value="low">🟢 Baixa — SLA 96h</option></select></div>
          </div>
          <div style={{ marginTop: '12px' }}><label className="form-label">Área Responsável *</label><select style={inp} value={f.area_responsible} onChange={e=>set('area_responsible',e.target.value)}>{areas.map(a=><option key={a.v} value={a.v}>{a.l}</option>)}</select></div>
        </div>

        {/* SEÇÃO 6 — EQUIPES A NOTIFICAR */}
        <div style={{ background: 'var(--bg)', borderRadius: '9px', padding: '14px' }}>
          <div style={{ fontSize: '11px', fontWeight: '700', color: 'var(--pd)', textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: '10px' }}>Equipes a Notificar</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px' }}>
            {areas.map(a=><label key={a.v} style={{ display: 'flex', alignItems: 'center', gap: '6px', padding: '7px 13px', borderRadius: '8px', border: `1.5px solid ${f.notify_areas.includes(a.v)?'var(--p)':'var(--line)'}`, background: f.notify_areas.includes(a.v)?'var(--pbg)':'#fff', cursor: 'pointer', fontSize: '12px', fontWeight: f.notify_areas.includes(a.v)?700:400, color: f.notify_areas.includes(a.v)?'var(--pd)':'var(--mid)', transition: '.12s', userSelect: 'none' }}>
              <input type="checkbox" style={{ display: 'none' }} checked={f.notify_areas.includes(a.v)} onChange={()=>{}}/>
              <span onClick={() => { const na = f.notify_areas.includes(a.v) ? f.notify_areas.filter(x=>x!==a.v) : [...f.notify_areas, a.v]; set('notify_areas', na); }} style={{ cursor: 'pointer', width: '100%' }}>{f.notify_areas.includes(a.v)?'✓ ':''}{a.l}</span>
            </label>)}
          </div>
          <p style={{ fontSize: '10px', color: 'var(--muted)', marginTop: '8px' }}>As equipes selecionadas serão notificadas sobre este chamado.</p>
        </div>

        <StagedAttachments files={staged} setFiles={setStaged} />

        <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', marginTop: '24px', paddingTop: '16px', borderTop: '1px solid var(--line)' }}>
          <button type="button" className="btn btn-outline" onClick={onClose}>Cancelar</button>
          <button type="submit" className="btn btn-purple" disabled={busy}>{busy && <span className="spinner" style={{ marginRight: '6px' }} />}✓ Abrir Chamado</button>
        </div>
      </form>
    </div>
  </div>;
}

const TICKET_STATUS_LABEL = {
  new: 'Novo', in_triage: 'Em triagem', awaiting_info: 'Aguardando informações',
  in_technical_analysis: 'Em análise técnica', awaiting_cd_ops: 'Aguardando operação/CD',
  awaiting_supplier: 'Aguardando compras/fornecedor', awaiting_fiscal: 'Aguardando fiscal/cadastro',
  in_resolution: 'Em solução', awaiting_client_validation: 'Aguardando validação do cliente',
  resolved: 'Resolvido', closed: 'Encerrado', reopened: 'Reaberto',
};
// Fluxo sugerido de avanço — o backend ainda aceita qualquer transição válida do enum,
// isto é só a ordem natural mostrada como botão "próxima ação" na tela.
const TICKET_STATUS_NEXT = {
  new: ['in_triage'],
  in_triage: ['awaiting_info', 'in_technical_analysis', 'awaiting_cd_ops'],
  awaiting_info: ['in_triage', 'in_technical_analysis'],
  in_technical_analysis: ['awaiting_supplier', 'awaiting_fiscal', 'in_resolution'],
  awaiting_cd_ops: ['in_resolution'],
  awaiting_supplier: ['in_technical_analysis', 'in_resolution'],
  awaiting_fiscal: ['in_technical_analysis', 'in_resolution'],
  in_resolution: ['awaiting_client_validation', 'resolved'],
  awaiting_client_validation: ['in_resolution', 'resolved'],
  resolved: ['closed'],
  closed: [],
  reopened: ['in_triage'],
};
const ROOT_CAUSE_CATEGORIES = [
  { v: 'commercial_error', l: 'Erro comercial' }, { v: 'spec_error', l: 'Erro de especificação' },
  { v: 'registration_error', l: 'Erro de cadastro' }, { v: 'fiscal_error', l: 'Erro fiscal' },
  { v: 'picking_error', l: 'Erro de separação' }, { v: 'shipping_error', l: 'Erro de expedição' },
  { v: 'transport_damage', l: 'Dano em transporte' }, { v: 'manufacturing_defect', l: 'Defeito de fabricação' },
  { v: 'misuse', l: 'Mau uso' }, { v: 'incorrect_installation', l: 'Instalação incorreta' },
  { v: 'supplier_failure', l: 'Falha de fornecedor' }, { v: 'communication_failure', l: 'Falha de comunicação' },
  { v: 'out_of_stock', l: 'Falta de estoque' }, { v: 'no_process', l: 'Processo inexistente' },
  { v: 'process_not_followed', l: 'Processo não seguido' }, { v: 'training_gap', l: 'Falta de treinamento' },
  { v: 'incomplete_client_info', l: 'Informação incompleta do cliente' }, { v: 'other', l: 'Outro' },
];

function TicketDetailModal({ id, onClose, onChanged, toast }) {
  const [t, setT] = useState(null);
  const [history, setHistory] = useState([]);
  const [users, setUsers] = useState([]);
  const [busy, setBusy] = useState(false);
  const [tab, setTab] = useState('overview');
  const [note, setNote] = useState('');
  const [edit, setEdit] = useState({
    am_user_id: '', bdm_user_id: '', area_responsible: 'support', client_name: '', client_cnpj: '',
    product_name_snap: '', product_group: '', brand: '', quantity: '', serial_number_snap: '',
    order_number: '', nf_number: '', order_value: '', revenue_at_risk: '', criticality: '',
    description: '', expectation: '', previous_action: '',
    root_cause_category: '', root_cause_description: '',
    resolution: '', preventive_action: '',
  });
  const [approveComment, setApproveComment] = useState('');

  const load = async () => {
    try {
      const data = await api(`/tickets/${id}`);
      setT(data);
      setEdit({
        am_user_id: data.am_user_id || '', bdm_user_id: data.bdm_user_id || '',
        area_responsible: data.area_responsible || '', client_name: data.client_name || '', client_cnpj: data.client_cnpj || '',
        product_name_snap: data.product_name_snap || '', product_group: data.product_group || '', brand: data.brand || '',
        quantity: data.quantity ?? 1, serial_number_snap: data.serial_number_snap || '',
        order_number: data.order_number || '', nf_number: data.nf_number || '',
        order_value: data.order_value ?? '', revenue_at_risk: data.revenue_at_risk ?? '', criticality: data.criticality || '',
        description: data.description || '', expectation: data.expectation || '', previous_action: data.previous_action || '',
        root_cause_category: data.root_cause_category || '', root_cause_description: data.root_cause_description || '',
        resolution: data.resolution || '', preventive_action: data.preventive_action || '',
      });
      const h = await api(`/tickets/${id}/history`);
      setHistory(h || []);
    } catch(e) { toast?.(e.message, 'error'); }
  };
  useEffect(() => { load(); }, [id]);
  useEffect(() => { (async () => { try { setUsers(await api('/users/lookup')); } catch(e) {} })(); }, []);

  const saveEdit = async (fieldsOverride) => {
    const payload = fieldsOverride || edit;
    if ('nf_number' in payload && !String(payload.nf_number||'').trim()) { toast?.('Nota Fiscal (NF) não pode ficar vazia.', 'error'); return; }
    if ('quantity' in payload) {
      const q = Number(payload.quantity);
      if (!Number.isInteger(q) || q <= 0) { toast?.('Quantidade deve ser um número inteiro maior que zero.', 'error'); return; }
    }
    setBusy(true);
    try {
      await api(`/tickets/${id}`, 'PATCH', payload);
      toast?.('Chamado atualizado.'); await load(); onChanged?.();
    } catch(e) { toast?.(e.message, 'error'); }
    finally { setBusy(false); }
  };

  const changeStatus = async (status) => {
    setBusy(true);
    try {
      await api(`/tickets/${id}/status`, 'PATCH', { status });
      toast?.(`Status: ${TICKET_STATUS_LABEL[status]}.`); await load(); onChanged?.();
    } catch(e) { toast?.(e.message, 'error'); }
    finally { setBusy(false); }
  };

  const approve = async (result) => {
    setBusy(true);
    try {
      await api(`/tickets/${id}/approve`, 'PATCH', { result, comment: approveComment || undefined });
      toast?.(result === 'approved' ? 'Chancela aprovada.' : 'Chancela reprovada.');
      setApproveComment(''); await load(); onChanged?.();
    } catch(e) { toast?.(e.message, 'error'); }
    finally { setBusy(false); }
  };

  const reopen = async () => {
    setBusy(true);
    try { await api(`/tickets/${id}/reopen`, 'POST'); toast?.('Chamado reaberto.'); await load(); onChanged?.(); }
    catch(e) { toast?.(e.message, 'error'); }
    finally { setBusy(false); }
  };

  const addNote = async () => {
    if (!note.trim()) return;
    setBusy(true);
    try { await api(`/tickets/${id}/notes`, 'POST', { note }); setNote(''); await load(); }
    catch(e) { toast?.(e.message, 'error'); }
    finally { setBusy(false); }
  };

  if (!t) return <div className="modal"><div className="modal-content" style={{ padding: '40px', textAlign: 'center' }}><span className="spinner" /></div></div>;
  const nextStatuses = TICKET_STATUS_NEXT[t.status] || [];
  const canReopen = ['closed', 'resolved'].includes(t.status);

  return <div className="modal" onClick={e => e.target === e.currentTarget && onClose()}>
    <div className="modal-content" style={{ maxWidth: '780px' }}>
      <div className="modal-hdr">
        <div><div className="modal-title">{t.id} — {t.client_name}</div>
          <div className="modal-sub"><span className={`badge badge-${t.criticality}`}>{t.criticality}</span> &nbsp; <Pill>{TICKET_STATUS_LABEL[t.status] || t.status}</Pill>
            {t.sla_state === 'overdue' && <span style={{ marginLeft: '8px', color: 'var(--red)', fontWeight: 700 }}>⚠ SLA vencido</span>}
          </div></div>
        <button className="close-btn" onClick={onClose}>×</button>
      </div>
      <div className="modal-body">
        <div className="tabbar">
          <div className={`tabbar-item ${tab === 'overview' ? 'active' : ''}`} onClick={() => setTab('overview')}>Visão Geral</div>
          <div className={`tabbar-item ${tab === 'flow' ? 'active' : ''}`} onClick={() => setTab('flow')}>Fluxo de Status</div>
          <div className={`tabbar-item ${tab === 'closure' ? 'active' : ''}`} onClick={() => setTab('closure')}>Causa Raiz & Encerramento</div>
          <div className={`tabbar-item ${tab === 'history' ? 'active' : ''}`} onClick={() => setTab('history')}>Histórico</div>
        </div>

        {tab === 'overview' && <>
          {t.status === 'closed' && (
            <div style={{ marginBottom: '14px', padding: '10px 12px', background: '#FEF3C7', borderRadius: '8px', fontSize: '12.5px', color: '#92400E' }}>
              🔒 Chamado encerrado — os campos abaixo estão bloqueados. Use "↺ Reabrir Chamado" na aba Fluxo de Status para editar novamente.
            </div>
          )}
          <p style={{ fontSize: '13px', color: 'var(--mid)', background: 'var(--bg)', padding: '12px', borderRadius: '8px', marginBottom: '14px', whiteSpace: 'pre-wrap' }}>{t.description}</p>
          {t.revenue_at_risk > 0 && (
            <div style={{ marginBottom: '14px', padding: '12px', background: 'rgba(220,38,38,.1)', borderRadius: '8px', borderLeft: '3px solid var(--red)' }}>
              <span className="form-label" style={{ color: 'var(--red)' }}>Receita em Risco</span>
              <p style={{ fontSize: '16px', fontWeight: '700', color: 'var(--red)', marginTop: '4px' }}>{formatMoney(t.revenue_at_risk)}</p>
            </div>
          )}
          <fieldset disabled={t.status === 'closed'} style={{ border: 'none', padding: 0, margin: 0 }}>
          <div style={{ background: 'var(--bg)', borderRadius: '9px', padding: '14px', marginBottom: '12px' }}>
            <div style={{ fontSize: '11px', fontWeight: 700, color: 'var(--pd)', textTransform: 'uppercase', marginBottom: '10px' }}>Cliente</div>
            <div className="form-row">
              <div className="form-group"><label className="form-label">Nome do Cliente</label>
                <input className="form-input" value={edit.client_name} onChange={e => setEdit(p => ({ ...p, client_name: e.target.value }))} /></div>
              <div className="form-group"><label className="form-label">CNPJ</label>
                <input className="form-input" value={edit.client_cnpj || ''} onChange={e => setEdit(p => ({ ...p, client_cnpj: formatCNPJ(e.target.value) }))} placeholder="00.000.000/0000-00" maxLength={18} />
                {(edit.client_cnpj || '').replace(/\D/g,'').length===14 && <span style={{ fontSize: '11px', fontWeight: 600, color: isValidCNPJ(edit.client_cnpj)?'var(--ok)':'var(--red)' }}>{isValidCNPJ(edit.client_cnpj)?'✓ válido':'✗ inválido'}</span>}
              </div>
            </div>
          </div>
          <div style={{ background: 'var(--bg)', borderRadius: '9px', padding: '14px', marginBottom: '12px' }}>
            <div style={{ fontSize: '11px', fontWeight: 700, color: 'var(--pd)', textTransform: 'uppercase', marginBottom: '10px' }}>Produto</div>
            <div className="form-row-3">
              <div className="form-group"><label className="form-label">Produto</label>
                <input className="form-input" value={edit.product_name_snap} onChange={e => setEdit(p => ({ ...p, product_name_snap: e.target.value }))} /></div>
              <div className="form-group"><label className="form-label">Grupo do Produto</label>
                <input className="form-input" value={edit.product_group} onChange={e => setEdit(p => ({ ...p, product_group: e.target.value }))} /></div>
              <div className="form-group"><label className="form-label">Marca</label>
                <input className="form-input" value={edit.brand} onChange={e => setEdit(p => ({ ...p, brand: e.target.value }))} /></div>
            </div>
            <div className="form-row-3">
              <div className="form-group"><label className="form-label">Quantidade</label>
                <input className="form-input" type="number" min="1" step="1" value={edit.quantity} onChange={e => setEdit(p => ({ ...p, quantity: e.target.value }))} /></div>
              <div className="form-group"><label className="form-label">Nº de Série</label>
                <input className="form-input" value={edit.serial_number_snap} onChange={e => setEdit(p => ({ ...p, serial_number_snap: e.target.value }))} /></div>
              <div className="form-group"><label className="form-label">Criticidade</label>
                <select className="form-input" value={edit.criticality} onChange={e => setEdit(p => ({ ...p, criticality: e.target.value }))}>
                  <option value="critical">Crítica</option><option value="high">Alta</option><option value="medium">Média</option><option value="low">Baixa</option>
                </select></div>
            </div>
          </div>
          <div style={{ background: 'var(--bg)', borderRadius: '9px', padding: '14px', marginBottom: '12px' }}>
            <div style={{ fontSize: '11px', fontWeight: 700, color: 'var(--pd)', textTransform: 'uppercase', marginBottom: '10px' }}>Pedido & Nota Fiscal</div>
            <div className="form-row">
              <div className="form-group"><label className="form-label">Nº Pedido</label>
                <input className="form-input" value={edit.order_number} onChange={e => setEdit(p => ({ ...p, order_number: e.target.value }))} /></div>
              <div className="form-group"><label className="form-label">NF *</label>
                <input className="form-input" style={{ borderColor: !String(edit.nf_number||'').trim() ? 'var(--red)' : undefined }} value={edit.nf_number} onChange={e => setEdit(p => ({ ...p, nf_number: e.target.value }))} />
                {!String(edit.nf_number||'').trim() && <span style={{ fontSize: '11px', color: 'var(--red)' }}>NF é obrigatória.</span>}
              </div>
            </div>
          </div>
          <div style={{ background: 'var(--bg)', borderRadius: '9px', padding: '14px' }}>
            <div style={{ fontSize: '11px', fontWeight: 700, color: 'var(--pd)', textTransform: 'uppercase', marginBottom: '10px' }}>Responsáveis & Valores</div>
            <div className="form-row">
              <div className="form-group"><label className="form-label">AM (Account Manager)</label>
                <select className="form-input" value={edit.am_user_id} onChange={e => setEdit(p => ({ ...p, am_user_id: e.target.value }))}>
                  <option value="">— Nenhum —</option>{byTitle(users,'AM').map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
                </select></div>
              <div className="form-group"><label className="form-label">BDM</label>
                <select className="form-input" value={edit.bdm_user_id} onChange={e => setEdit(p => ({ ...p, bdm_user_id: e.target.value }))}>
                  <option value="">— Nenhum —</option>{byTitle(users,'BDM').map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
                </select></div>
            </div>
            <div className="form-row">
              <div className="form-group"><label className="form-label">Área Responsável</label>
                <select className="form-input" value={edit.area_responsible} onChange={e => setEdit(p => ({ ...p, area_responsible: e.target.value }))}>
                  {[{v:'support',l:'Suporte Técnico'},{v:'operations',l:'Operações/CD'},{v:'sales',l:'Comercial'},
                    {v:'purchasing',l:'Compras'},{v:'warehouse',l:'CD/Estoque'},{v:'fiscal',l:'Fiscal'},
                    {v:'rma',l:'RMA'},{v:'financial',l:'Financeiro'}].map(a => <option key={a.v} value={a.v}>{a.l}</option>)}
                </select></div>
            </div>
            <div className="form-row">
              <div className="form-group"><label className="form-label">Valor do Pedido (R$)</label>
                <input className="form-input" type="number" step="0.01" value={edit.order_value} onChange={e => setEdit(p => ({ ...p, order_value: e.target.value }))} placeholder="0.00" /></div>
              <div className="form-group"><label className="form-label">Receita em Risco (R$)</label>
                <input className="form-input" type="number" step="0.01" value={edit.revenue_at_risk} onChange={e => setEdit(p => ({ ...p, revenue_at_risk: e.target.value }))} placeholder="0.00" /></div>
            </div>
            <div className="form-group"><label className="form-label">Descrição</label>
              <textarea className="form-input" value={edit.description} onChange={e => setEdit(p => ({ ...p, description: e.target.value }))} /></div>
            <div className="form-row">
              <div className="form-group"><label className="form-label">Expectativa</label>
                <textarea className="form-input" value={edit.expectation} onChange={e => setEdit(p => ({ ...p, expectation: e.target.value }))} /></div>
              <div className="form-group"><label className="form-label">Ação já tentada</label>
                <textarea className="form-input" value={edit.previous_action} onChange={e => setEdit(p => ({ ...p, previous_action: e.target.value }))} /></div>
            </div>
            <button className="btn btn-sm btn-purple" disabled={busy} onClick={() => saveEdit({
              am_user_id: edit.am_user_id || null, bdm_user_id: edit.bdm_user_id || null,
              area_responsible: edit.area_responsible, client_name: edit.client_name, client_cnpj: edit.client_cnpj || null,
              product_name_snap: edit.product_name_snap || null, product_group: edit.product_group || null, brand: edit.brand || null,
              quantity: edit.quantity, serial_number_snap: edit.serial_number_snap || null,
              order_number: edit.order_number || null, nf_number: edit.nf_number, criticality: edit.criticality,
              description: edit.description, expectation: edit.expectation || null, previous_action: edit.previous_action || null,
              order_value: edit.order_value === '' ? null : parseFloat(edit.order_value),
              revenue_at_risk: edit.revenue_at_risk === '' ? 0 : parseFloat(edit.revenue_at_risk),
            })}>Salvar Dados</button>
          </div>
          </fieldset>
        </>}

        {tab === 'flow' && <>
          <p style={{ fontSize: '12px', color: 'var(--muted)', marginBottom: '10px' }}>Status atual: <strong>{TICKET_STATUS_LABEL[t.status]}</strong></p>
          <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', marginBottom: '16px' }}>
            {nextStatuses.map(s => <button key={s} className="btn btn-sm btn-purple" disabled={busy} onClick={() => changeStatus(s)}>→ {TICKET_STATUS_LABEL[s]}</button>)}
            {!nextStatuses.length && t.status !== 'closed' && <span style={{ fontSize: '12px', color: 'var(--muted)' }}>Vá para a aba "Causa Raiz & Encerramento" para encerrar.</span>}
          </div>
          {canReopen && <button className="btn btn-sm btn-outline" disabled={busy} onClick={reopen}>↺ Reabrir Chamado</button>}

          <div style={{ marginTop: '20px', borderTop: '1px solid var(--line)', paddingTop: '14px' }}>
            <div style={{ fontSize: '11px', fontWeight: 700, color: 'var(--pd)', textTransform: 'uppercase', marginBottom: '10px' }}>Chancela do Gestor</div>
            <p style={{ fontSize: '12px', color: 'var(--mid)', marginBottom: '8px' }}>Status atual da chancela: <strong>{t.approval_status || 'pending'}</strong></p>
            <input className="form-input" style={{ marginBottom: '8px' }} value={approveComment} onChange={e => setApproveComment(e.target.value)} placeholder="Parecer (opcional)" />
            <div style={{ display: 'flex', gap: '8px' }}>
              <button className="btn btn-sm btn-purple" disabled={busy} onClick={() => approve('approved')}>✓ Aprovar</button>
              <button className="btn btn-sm btn-outline" disabled={busy} onClick={() => approve('rejected')}>✗ Reprovar</button>
            </div>
          </div>
        </>}

        {tab === 'closure' && <>
          <div className="form-group">
            <label className="form-label">Categoria da Causa Raiz {!t.root_cause_category && <span style={{color:'var(--red)'}}>* obrigatória para encerrar</span>}</label>
            <select className="form-input" value={edit.root_cause_category} onChange={e => setEdit(p => ({ ...p, root_cause_category: e.target.value }))}>
              <option value="">Selecione...</option>{ROOT_CAUSE_CATEGORIES.map(c => <option key={c.v} value={c.v}>{c.l}</option>)}
            </select>
          </div>
          <div className="form-group"><label className="form-label">Descrição da Causa Raiz</label>
            <textarea className="form-input" value={edit.root_cause_description} onChange={e => setEdit(p => ({ ...p, root_cause_description: e.target.value }))} placeholder="Detalhe o que de fato causou o problema..." /></div>
          <div className="form-group"><label className="form-label">Resolução {!t.resolution && <span style={{color:'var(--red)'}}>* obrigatória para encerrar</span>}</label>
            <textarea className="form-input" value={edit.resolution} onChange={e => setEdit(p => ({ ...p, resolution: e.target.value }))} placeholder="O que foi feito para resolver?" /></div>
          <div className="form-group"><label className="form-label">Ação Preventiva {t.reopen_count >= 2 && <span style={{color:'var(--red)'}}>* obrigatória (chamado já reaberto {t.reopen_count}x)</span>}</label>
            <textarea className="form-input" value={edit.preventive_action} onChange={e => setEdit(p => ({ ...p, preventive_action: e.target.value }))} placeholder="O que evita que isso aconteça de novo?" /></div>
          <div style={{ display: 'flex', gap: '8px' }}>
            <button className="btn btn-sm btn-purple" disabled={busy} onClick={() => saveEdit({
              root_cause_category: edit.root_cause_category || null, root_cause_description: edit.root_cause_description || null,
              resolution: edit.resolution || null, preventive_action: edit.preventive_action || null,
            })}>Salvar Causa Raiz / Resolução</button>
            {t.status !== 'closed' && <button className="btn btn-sm btn-outline" disabled={busy} onClick={() => changeStatus('closed')}>🔒 Tentar Encerrar</button>}
          </div>
          <p style={{ fontSize: '11px', color: 'var(--muted)', marginTop: '8px' }}>O encerramento exige causa raiz preenchida, resolução preenchida e chancela aprovada — salve os campos antes de tentar encerrar.</p>
        </>}

        {tab === 'history' && <>
          <AttachmentsPanel entityType="ticket" entityId={t.id} toast={toast} />

        <div style={{ marginTop: '14px', paddingTop: '10px', borderTop: '1px dashed var(--border)', display: 'flex', justifyContent: 'flex-end' }}>
          <DeleteButton path="tickets" id={t.id} label="Chamado" toast={toast} onDeleted={() => { onChanged?.(); onClose(); }} />
        </div>
          <Timeline items={history} />
          <div className="form-group" style={{ marginTop: '14px' }}>
            <label className="form-label">Adicionar nota interna</label>
            <div style={{ display: 'flex', gap: '8px' }}>
              <input className="form-input" value={note} onChange={e => setNote(e.target.value)} placeholder="Nota interna..." />
              <button className="btn btn-sm btn-outline" disabled={busy} onClick={addNote}>Adicionar</button>
            </div>
          </div>
        </>}
      </div>
    </div>
  </div>;
}
